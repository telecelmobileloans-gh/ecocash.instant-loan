<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Airtel Lite DRC</title>
    <link rel="icon" type="image/png" href="https://www.airtel.in/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
            background: #ffffff;
            color: #000;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #ED1C24;
            color: white;
            padding: 1rem 5%;
            text-align: center;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .logo-airtel { color: white; }
        .logo-lite { color: #FFD200; }
        .airtel-logo-img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 5%;
        }
        .lang-card {
            background: #f8f9fa;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .lang-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ED1C24;
            margin-bottom: 0.5rem;
        }
        .lang-subtitle {
            color: #555;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .lang-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 2px solid #ED1C24;
            border-radius: 12px;
            background: white;
            color: #ED1C24;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-btn:hover {
            background: #ED1C24;
            color: white;
        }
        .lang-btn:last-child { margin-bottom: 0; }
        footer {
            background: #000;
            color: #aaa;
            padding: 0.9rem 5%;
            text-align: center;
            font-size: 0.75rem;
            border-top: 3px solid #ED1C24;
        }
    </style>
</head>
<body>
<header>
    <div class="logo">
        <span class="logo-airtel">Airtel</span>
        <span class="logo-lite">Lite</span>
        <img src="https://s3-ap-southeast-1.amazonaws.com/bsy/iportal/images/airtel-logo1.png" alt="Airtel Logo" class="airtel-logo-img">
    </div>
</header>
<main>
    <div class="lang-card">
        <h1 class="lang-title">Choose Language</h1>
        <p class="lang-subtitle">Choisissez votre langue</p>
        <button class="lang-btn" onclick="selectLang('en')">English</button>
        <button class="lang-btn" onclick="selectLang('fr')">Français</button>
    </div>
</main>
<footer>
    © 2026 Airtel DRC. All rights reserved.<br>
    *123#
</footer>
<script>
    function selectLang(lang) {
        localStorage.setItem('lang', lang);
        window.location.href = 'home';
    }
    // Skip if language already chosen
    if (localStorage.getItem('lang')) {
        window.location.href = 'home';
    }
</script>
</body>
</html>
