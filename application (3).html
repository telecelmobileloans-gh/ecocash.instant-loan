<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>lite.airtel.cd</title>
    <link rel="icon" type="image/png" href="https://www.airtel.in/favicon.ico">
    <meta name="description" content="Airtel Lite DRC – Top-up, Airtel Money, quick loans.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; background: #ffffff; color: #000; overflow: hidden; }
        body { display: flex; flex-direction: column; }
        header { background: #ED1C24; color: white; padding: 0.8rem 5%; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .header-container { display: flex; justify-content: space-between; align-items: center; }
        .back-btn { font-size: 1.8rem; background: none; border: none; color: white; cursor: pointer; }
        .logo { font-size: 1.8rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
        .logo-airtel { color: white; }
        .logo-lite { color: #FFD200; }
        .airtel-logo-img { width: 28px; height: 28px; object-fit: contain; }
        main { flex: 1; padding: 1rem 5% 1rem; display: flex; flex-direction: column; overflow-y: auto; }
        .form-card { background: #f8f9fa; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); padding: 1.2rem; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .form-title { font-size: 1.25rem; font-weight: 700; color: #ED1C24; text-align: center; margin-bottom: 0.8rem; }
        .loan-summary { background: #fff5f5; border-radius: 10px; padding: 0.8rem; margin-bottom: 1rem; text-align: center; font-size: 0.95rem; }
        .progress-bar { width: 100%; height: 6px; background: #e0e0e0; border-radius: 3px; margin: 0.5rem 0 1rem; }
        .progress-fill { width: 66.66%; height: 100%; background: #ED1C24; border-radius: 3px; }
        .step-text { text-align: center; color: #555; font-size: 0.9rem; margin-bottom: 1.2rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-label { font-weight: 500; color: #222; margin-bottom: 0.4rem; font-size: 0.95rem; display: block; }
        .phone-wrapper { position: relative; display: flex; align-items: center; border: 1px solid #ccc; border-radius: 10px; overflow: hidden; }
        .phone-prefix { background: #f0f0f0; color: #555; padding: 0.8rem 1rem; font-size: 1rem; border-right: 1px solid #ccc; white-space: nowrap; }
        .phone-input { flex: 1; border: none; padding: 0.8rem 1rem; font-size: 1rem; outline: none; }
        .phone-input:focus { box-shadow: 0 0 0 3px rgba(237,28,36,0.15); }
        .form-input, .form-select { width: 100%; padding: 0.8rem 1rem; border: 1px solid #ccc; border-radius: 10px; font-size: 1rem; }
        .form-input:focus, .form-select:focus { border-color: #ED1C24; outline: none; box-shadow: 0 0 0 3px rgba(237,28,36,0.15); }
        .field-error { color: #c8102e; font-size: 0.85rem; margin-top: 0.3rem; display: none; }
        .invalid .phone-wrapper { border-color: #c8102e !important; box-shadow: 0 0 0 3px rgba(200,16,46,0.15) !important; }
        .next-btn { width: 100%; padding: 0.9rem; background: #ED1C24; color: white; border: none; border-radius: 10px; font-size: 1.05rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
        .next-btn:hover { background: #c8102e; }
        footer { background: #000; color: #aaa; padding: 0.9rem 5%; text-align: center; font-size: 0.75rem; border-top: 3px solid #ED1C24; }
        @media (max-width: 480px) { main { padding: 0.8rem 4%; } .form-card { padding: 1rem; } }
    </style>
</head>
<body>
<header>
    <div class="header-container">
        <button class="back-btn" onclick="history.back()">←</button>
        <div class="logo">
            <span class="logo-airtel">Airtel</span>
            <span class="logo-lite">Lite</span>
            <img src="https://s3-ap-southeast-1.amazonaws.com/bsy/iportal/images/airtel-logo1.png" alt="Airtel Logo" class="airtel-logo-img">
        </div>
    </div>
</header>
<main>
    <div class="form-card">
        <h2 class="form-title" id="formTitle">Your Personal Information</h2>
        <div class="progress-bar"><div class="progress-fill"></div></div>
        <div class="step-text" id="stepText">Step 2 of 3 – Personal details</div>
        <div class="loan-summary">
            <strong id="summaryLabel">Request:</strong> <span id="summaryAmount">CDF 0</span> <span id="forText">for</span> <span id="summaryTerm">0 months</span>
        </div>
        <div class="form-group">
            <label class="form-label" id="nameLabel" for="fullName">Full Name</label>
            <input type="text" class="form-input" id="fullName" placeholder="" required>
            <div class="field-error" id="nameError"></div>
        </div>
        <div class="form-group">
            <label class="form-label" id="phoneLabel" for="phoneNumber">Airtel Phone Number</label>
            <div class="phone-wrapper">
                <span class="phone-prefix">+243</span>
                <input type="tel" class="phone-input" id="phoneNumber" placeholder="81XXXXXXX" pattern="[0-9]{7,9}" inputmode="numeric" required>
            </div>
            <div class="field-error" id="phoneError"></div>
        </div>
        <div class="form-group">
            <label class="form-label" id="occLabel" for="occupation">Occupation / Activity</label>
            <select class="form-select" id="occupation" required>
                <option value="" id="occPlaceholder">Select...</option>
                <option value="Salarié" id="occ1">Employee</option>
                <option value="Commerçant / Entrepreneur" id="occ2">Trader / Entrepreneur</option>
                <option value="Étudiant" id="occ3">Student</option>
                <option value="Fonctionnaire" id="occ4">Civil Servant</option>
                <option value="Autre" id="occ5">Other</option>
            </select>
            <div class="field-error" id="occError"></div>
        </div>
        <div class="form-group">
            <label class="form-label" id="emailLabel" for="email">Email (optional)</label>
            <input type="email" class="form-input" id="email" placeholder="you@email.com">
        </div>
        <button class="next-btn" id="nextBtn">NEXT STEP</button>
    </div>
</main>
<footer id="footerText">
    © 2026 Airtel DRC. All rights reserved.<br>
    Terms & Conditions • *123#
</footer>

<script>
    if (!localStorage.getItem('lang')) window.location.href = 'index';

    const lang = localStorage.getItem('lang') || 'en';
    const t = {
        en: {
            formTitle: "Your Personal Information",
            stepText: "Step 2 of 3 – Personal details",
            summaryLabel: "Request:",
            forText: "for",
            nameLabel: "Full Name",
            namePlaceholder: "Your full name",
            nameError: "Please enter your full name.",
            phoneLabel: "Airtel Phone Number",
            phoneError: "Please enter a valid number (7-9 digits after +243).",
            occLabel: "Occupation / Activity",
            occPlaceholder: "Select...",
            occ1: "Employee",
            occ2: "Trader / Entrepreneur",
            occ3: "Student",
            occ4: "Civil Servant",
            occ5: "Other",
            occError: "Please select your occupation.",
            emailLabel: "Email (optional)",
            nextBtn: "NEXT STEP",
            footer: "© 2026 Airtel DRC. All rights reserved.<br>Terms & Conditions • *123#",
            months: "months"
        },
        fr: {
            formTitle: "Vos Informations Personnelles",
            stepText: "Étape 2 sur 3 – Détails personnels",
            summaryLabel: "Demande :",
            forText: "sur",
            nameLabel: "Nom complet",
            namePlaceholder: "Votre nom et prénom",
            nameError: "Veuillez entrer votre nom complet.",
            phoneLabel: "Numéro de téléphone Airtel",
            phoneError: "Veuillez entrer un numéro valide (7-9 chiffres après +243).",
            occLabel: "Profession / Activité",
            occPlaceholder: "Sélectionnez...",
            occ1: "Salarié",
            occ2: "Commerçant / Entrepreneur",
            occ3: "Étudiant",
            occ4: "Fonctionnaire",
            occ5: "Autre",
            occError: "Veuillez sélectionner votre profession.",
            emailLabel: "Email (optionnel)",
            nextBtn: "ÉTAPE SUIVANTE",
            footer: "© 2026 Airtel DRC. Tous droits réservés.<br>Conditions générales • *123#",
            months: "mois"
        }
    };

    const tr = t[lang];
    document.getElementById('formTitle').textContent = tr.formTitle;
    document.getElementById('stepText').textContent = tr.stepText;
    document.getElementById('summaryLabel').textContent = tr.summaryLabel;
    document.getElementById('forText').textContent = tr.forText;
    document.getElementById('nameLabel').textContent = tr.nameLabel;
    document.getElementById('fullName').placeholder = tr.namePlaceholder;
    document.getElementById('nameError').textContent = tr.nameError;
    document.getElementById('phoneLabel').textContent = tr.phoneLabel;
    document.getElementById('phoneError').textContent = tr.phoneError;
    document.getElementById('occLabel').textContent = tr.occLabel;
    document.getElementById('occPlaceholder').textContent = tr.occPlaceholder;
    document.getElementById('occ1').textContent = tr.occ1;
    document.getElementById('occ2').textContent = tr.occ2;
    document.getElementById('occ3').textContent = tr.occ3;
    document.getElementById('occ4').textContent = tr.occ4;
    document.getElementById('occ5').textContent = tr.occ5;
    document.getElementById('occError').textContent = tr.occError;
    document.getElementById('emailLabel').textContent = tr.emailLabel;
    document.getElementById('nextBtn').textContent = tr.nextBtn;
    document.getElementById('footerText').innerHTML = tr.footer;

    // Pre-fill summary
    if (localStorage.getItem('loanAmount')) {
        document.getElementById('summaryAmount').textContent = 'CDF ' + parseFloat(localStorage.getItem('loanAmount')).toLocaleString();
    }
    if (localStorage.getItem('loanTerm')) {
        document.getElementById('summaryTerm').textContent = localStorage.getItem('loanTerm') + ' ' + tr.months;
    }

    const nameError = document.getElementById('nameError');
    const phoneError = document.getElementById('phoneError');
    const occError = document.getElementById('occError');

    document.getElementById('nextBtn').addEventListener('click', function() {
        let valid = true;
        [nameError, phoneError, occError].forEach(el => el.style.display = 'none');
        document.querySelectorAll('.form-input, .form-select, .phone-wrapper').forEach(el => el.classList.remove('invalid'));

        const fullName = document.getElementById('fullName').value.trim();
        let phone = document.getElementById('phoneNumber').value.trim().replace(/\s/g, '');
        const occupation = document.getElementById('occupation').value;

        if (!fullName) {
            document.getElementById('fullName').classList.add('invalid');
            nameError.style.display = 'block';
            valid = false;
        }
        if (!phone || !/^[0-9]{7,9}$/.test(phone)) {
            document.querySelector('.phone-wrapper').classList.add('invalid');
            phoneError.style.display = 'block';
            valid = false;
        } else {
            phone = '+243' + phone;
        }
        if (!occupation) {
            document.getElementById('occupation').classList.add('invalid');
            occError.style.display = 'block';
            valid = false;
        }
        if (!valid) return;

        localStorage.setItem('fullName', fullName);
        localStorage.setItem('phoneNumber', phone);
        localStorage.setItem('occupation', occupation);
        localStorage.setItem('email', document.getElementById('email').value.trim() || '');
        window.location.href = 'summary';
    });
</script>
</body>
</html>
